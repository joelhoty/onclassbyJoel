<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-label="U8g2 建構式呼叫鏈與記憶體去向"><title>U8g2 建構式呼叫鏈與記憶體去向</title><metadata>{&quot;updated&quot;: &quot;2026-10-27 17:50:55 (UTC+8)&quot;, &quot;model&quot;: &quot;Claude Opus 5.5&quot;, &quot;agent&quot;: &quot;Claude Code&quot;, &quot;Prompt Archive&quot;: [&quot;ec/u8g2_display_modes_memory_guide.md 檢視這份資料，並補充 class construct _1 _2的說明，並在解說與範例加上適合的圖形解說&quot;, &quot;建構式與硬體ssd 1306為例 要如何選擇？根據需求還是根據硬體的規格&quot;]}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><rect x="1" y="1" width="1198" height="768" rx="18" fill="#f5f8fb" stroke="#d9e2eb" stroke-width="1.5"/><text x="40" y="50" font-size="26" fill="#173047" font-weight="bold" text-anchor="start">建構式在做什麼：宣告物件時「只設定、不通訊」，begin() 才第一次和 OLED 對話</text><text x="40" y="82" font-size="16" fill="#55697c" font-weight="normal" text-anchor="start">依 U8g2 2.36.19 原始碼 U8g2lib.h、u8g2_d_setup.c、u8g2_d_memory.c 整理；以 _1_HW_I2C 為例。</text><rect x="40" y="104" width="740" height="470" rx="14" fill="#eef7f6" stroke="#087e82" stroke-width="1.5"/><text x="60" y="134" font-size="18" fill="#087e82" font-weight="bold" text-anchor="start">① 全域物件建立：在 setup() 之前由 C++ 自動執行（此時 I²C 尚無通訊）</text><rect x="60" y="150" width="700" height="58" rx="10" fill="#fff" stroke="#7eb6b6" stroke-width="1.5"/><text x="76" y="175" font-size="16" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">U8G2_SSD1306_128X64_NONAME_1_HW_I2C u8g2(U8G2_R0, …);</text><text x="76" y="198" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">宣告全域物件 → 呼叫類別建構式</text><path d="M410,208 L410,224" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="226" width="700" height="58" rx="10" fill="#fff" stroke="#7eb6b6" stroke-width="1.5"/><text x="76" y="251" font-size="16" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">U8G2()</text><text x="76" y="274" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">基底類別：準備 u8g2_t 結構與共用繪圖函式</text><path d="M410,284 L410,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="302" width="700" height="58" rx="10" fill="#fff" stroke="#7eb6b6" stroke-width="1.5"/><text x="76" y="327" font-size="16" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">u8g2_Setup_ssd1306_i2c_128x64_noname_1()</text><text x="76" y="350" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">依「控制器＋解析度＋變體＋_1」選定的 C 設定函式</text><path d="M410,360 L410,376" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="378" width="228" height="138" rx="10" fill="#fff" stroke="#087e82" stroke-width="1.5"/><text x="72" y="404" font-size="15" fill="#087e82" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">u8g2_SetupDisplay()</text><text x="72" y="430" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start">驅動：ssd1306_128x64_noname</text><text x="72" y="452" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start">命令格式：ssd13xx_fast_i2c</text><text x="72" y="474" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start">傳輸：arduino_hw_i2c</text><rect x="296" y="378" width="228" height="138" rx="10" fill="#fff" stroke="#c47a00" stroke-width="2"/><text x="308" y="404" font-size="15" fill="#c47a00" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">u8g2_m_16_8_1(&amp;h)</text><text x="308" y="430" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">static uint8_t buf[128];</text><text x="308" y="452" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">h = 1（tile_buf_height）</text><text x="308" y="474" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">_2 → buf[256], h=2</text><text x="308" y="496" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">_F → buf[1024], h=8</text><rect x="532" y="378" width="228" height="138" rx="10" fill="#fff" stroke="#087e82" stroke-width="1.5"/><text x="544" y="404" font-size="15" fill="#087e82" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">u8g2_SetupBuffer()</text><text x="544" y="430" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">記下 buf 指標</text><text x="544" y="452" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start">記下 h 與旋轉 R0</text><text x="544" y="474" font-size="13.5" fill="#173047" font-weight="normal" text-anchor="start">auto page clear = 1</text><path d="M410,516 L410,534" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="536" width="700" height="40" rx="10" fill="#fff" stroke="#7eb6b6" stroke-width="1.5"/><text x="76" y="562" font-size="16" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">u8x8_SetPin_HW_I2C(reset, clock, data)</text><text x="470" y="562" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">只記錄腳位，尚未初始化 Wire</text><rect x="40" y="590" width="360" height="150" rx="14" fill="#fff" stroke="#2458b8" stroke-width="2"/><text x="60" y="620" font-size="18" fill="#2458b8" font-weight="bold" text-anchor="start">② setup()：第一次 I²C 通訊</text><text x="60" y="650" font-size="15" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">setI2CAddress(0x3C &lt;&lt; 1);</text><text x="60" y="672" font-size="15" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">begin() → initDisplay()</text><text x="132" y="694" font-size="15" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">→ clearDisplay()</text><text x="132" y="716" font-size="15" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">→ setPowerSave(0)</text><rect x="420" y="590" width="360" height="150" rx="14" fill="#fff" stroke="#c47a00" stroke-width="2"/><text x="440" y="620" font-size="18" fill="#c47a00" font-weight="bold" text-anchor="start">③ loop()：h 決定分頁輪數</text><text x="440" y="650" font-size="14.5" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">firstPage(): row = 0</text><text x="440" y="672" font-size="14.5" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">nextPage(): 送出 h 列 tile</text><text x="546" y="694" font-size="14.5" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">row += h</text><text x="440" y="716" font-size="14.5" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">row ≥ 8 → 結束（_1:8 輪, _2:4, _F:1）</text><path d="M400,665 L418,665" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="820" y="134" font-size="20" fill="#173047" font-weight="bold" text-anchor="start">記憶體去向</text><text x="820" y="164" font-size="17" fill="#087e82" font-weight="bold" text-anchor="start">SRAM（可讀寫）</text><rect x="820" y="176" width="340" height="40" rx="4" fill="#ffffff" stroke="#9fb3c2" stroke-width="1.2"/><text x="990" y="202.0" font-size="14.5" fill="#173047" font-weight="normal" text-anchor="middle">u8g2 物件本身（結構、狀態）</text><rect x="820" y="216" width="340" height="70" rx="4" fill="#c47a00" stroke="#9fb3c2" stroke-width="1.2"/><text x="990" y="257.0" font-size="14.5" fill="#fff" font-weight="bold" text-anchor="middle">static buf[128]（.bss，全域）</text><rect x="820" y="286" width="340" height="60" rx="4" fill="#ffffff" stroke="#9fb3c2" stroke-width="1.2"/><text x="990" y="322.0" font-size="14.5" fill="#173047" font-weight="normal" text-anchor="middle">Wire、Serial、你的變數</text><rect x="820" y="346" width="340" height="70" rx="4" fill="#e9eef2" stroke="#9fb3c2" stroke-width="1.2"/><text x="990" y="387.0" font-size="14.5" fill="#55697c" font-weight="normal" text-anchor="middle">heap ↓ … ↑ stack（執行時）</text><text x="820" y="442" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">buf 是 static 陣列 → 編譯報告的「全域變數」</text><text x="820" y="464" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">已含 128／256／1,024 B；不是執行時才配置。</text><text x="820" y="486" font-size="14" fill="#c47a00" font-weight="bold" text-anchor="start">同型別的多個物件會共用同一塊 buf。</text><text x="820" y="516" font-size="17" fill="#2458b8" font-weight="bold" text-anchor="start">Flash（程式空間）</text><rect x="820" y="528" width="340" height="40" rx="4" fill="#fff" stroke="#9fb3c2" stroke-width="1.2"/><text x="990" y="554" font-size="14.5" fill="#173047" font-weight="normal" text-anchor="middle">初始化命令序列（NONAME／ALT0）</text><rect x="820" y="568" width="340" height="40" rx="4" fill="#fff" stroke="#9fb3c2" stroke-width="1.2"/><text x="990" y="594" font-size="14.5" fill="#173047" font-weight="normal" text-anchor="middle">字型陣列（setFont 引用者）</text><rect x="820" y="608" width="340" height="40" rx="4" fill="#fff" stroke="#9fb3c2" stroke-width="1.2"/><text x="990" y="634" font-size="14.5" fill="#173047" font-weight="normal" text-anchor="middle">繪圖與通訊程式碼</text></g></svg>
