<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" role="img" aria-label="U8g2 SSD1306 建構式選擇決策圖"><title>U8g2 SSD1306 建構式選擇決策圖</title><metadata>{&quot;updated&quot;: &quot;2026-10-27 17:50:55 (UTC+8)&quot;, &quot;model&quot;: &quot;Claude Opus 5.5&quot;, &quot;agent&quot;: &quot;Claude Code&quot;, &quot;Prompt Archive&quot;: [&quot;ec/u8g2_display_modes_memory_guide.md 檢視這份資料，並補充 class construct _1 _2的說明，並在解說與範例加上適合的圖形解說&quot;, &quot;建構式與硬體ssd 1306為例 要如何選擇？根據需求還是根據硬體的規格&quot;]}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><rect x="1" y="1" width="1198" height="868" rx="18" fill="#f5f8fb" stroke="#d9e2eb" stroke-width="1.5"/><text x="40" y="50" font-size="28" fill="#173047" font-weight="bold" text-anchor="start">建構式怎麼選？先對硬體規格，再依需求與開發板取捨</text><text x="40" y="82" font-size="16" fill="#55697c" font-weight="normal" text-anchor="start">以 SSD1306 OLED 為例：左欄決定「能不能亮」，右欄決定「RAM 與寫法」。位址、旋轉與腳位是參數或函式，不在類別名稱裡。</text><rect x="40" y="110" width="540" height="52" rx="12" fill="#087e82" stroke="#087e82" stroke-width="1.5"/><text x="310" y="144" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle">① 硬體規格決定（不能自由選）</text><rect x="40" y="182" width="540" height="80" rx="12" fill="#fff" stroke="#087e82" stroke-width="2"/><circle cx="80" cy="222" r="24" fill="#087e82"/><text x="80" y="228" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">控制器</text><text x="120" y="216" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">看模組標示或賣場規格：SSD1306？</text><text x="120" y="242" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">1.3 吋常見 SH1106 → 改用 SH1106 類別</text><path d="M80,262 L80,274" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="276" width="540" height="80" rx="12" fill="#fff" stroke="#087e82" stroke-width="2"/><circle cx="80" cy="316" r="24" fill="#087e82"/><text x="80" y="322" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">解析度</text><text x="120" y="310" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">0.96 吋多為 128×64；0.91 吋多為 128×32</text><text x="120" y="336" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">→ 128X64_… 或 128X32_UNIVISION_…</text><path d="M80,356 L80,368" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="370" width="540" height="80" rx="12" fill="#fff" stroke="#087e82" stroke-width="2"/><circle cx="80" cy="410" r="24" fill="#087e82"/><text x="80" y="416" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">介面</text><text x="120" y="404" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">4 腳 VCC／GND／SCL／SDA → I²C</text><text x="120" y="430" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">7 腳 D0／D1／RES／DC／CS → SPI</text><path d="M80,450 L80,462" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="464" width="540" height="80" rx="12" fill="#fff" stroke="#087e82" stroke-width="2"/><circle cx="80" cy="504" r="24" fill="#087e82"/><text x="80" y="510" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">變體</text><text x="120" y="498" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">先試 NONAME；隔行、上下錯位試 ALT0</text><text x="120" y="524" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">VCOMH0 對比範圍大，但非每片適用</text><path d="M80,544 L80,556" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="558" width="540" height="80" rx="12" fill="#fff" stroke="#087e82" stroke-width="2"/><circle cx="80" cy="598" r="24" fill="#087e82"/><text x="80" y="604" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">位址</text><text x="120" y="592" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">I²C 掃描 0x3C 或 0x3D</text><text x="120" y="618" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">用 setI2CAddress()，不在類別名稱</text><rect x="620" y="110" width="540" height="52" rx="12" fill="#c47a00" stroke="#c47a00" stroke-width="1.5"/><text x="890" y="144" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle">② 需求與開發板決定（可以取捨）</text><rect x="620" y="182" width="540" height="80" rx="12" fill="#fff" stroke="#c47a00" stroke-width="2"/><circle cx="660" cy="222" r="24" fill="#c47a00"/><text x="660" y="228" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">API</text><text x="700" y="216" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">只顯示文字、數值 → U8X8_…</text><text x="700" y="242" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">要線條、圖形、任意字型 → U8G2_…</text><path d="M660,262 L660,274" fill="none" stroke="#c47a00" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="276" width="540" height="80" rx="12" fill="#fff" stroke="#c47a00" stroke-width="2"/><circle cx="660" cy="316" r="24" fill="#c47a00"/><text x="660" y="322" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">緩衝</text><text x="700" y="310" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">RAM 吃緊（Uno R3）→ _1</text><text x="700" y="336" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">折衷 _2；RAM 足、動畫、局部更新 → _F</text><path d="M660,356 L660,368" fill="none" stroke="#c47a00" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="370" width="540" height="80" rx="12" fill="#fff" stroke="#c47a00" stroke-width="2"/><circle cx="660" cy="410" r="24" fill="#c47a00"/><text x="660" y="416" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">接腳</text><text x="700" y="404" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">接在板子硬體 I²C 腳 → HW_I2C</text><text x="700" y="430" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">任意腳／第二組匯流排 → SW_I2C 或 2ND_HW_I2C</text><path d="M660,450 L660,462" fill="none" stroke="#c47a00" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="464" width="540" height="80" rx="12" fill="#fff" stroke="#c47a00" stroke-width="2"/><circle cx="660" cy="504" r="24" fill="#c47a00"/><text x="660" y="510" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">方向</text><text x="700" y="498" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">模組倒裝或直立 → U8G2_R0／R1／R2／R3</text><text x="700" y="524" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">是建構式第一個參數，不換類別</text><path d="M660,544 L660,556" fill="none" stroke="#c47a00" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="558" width="540" height="80" rx="12" fill="#fff" stroke="#c47a00" stroke-width="2"/><circle cx="660" cy="598" r="24" fill="#c47a00"/><text x="660" y="604" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">驗證</text><text x="700" y="592" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">編譯看 RAM 餘量，實機看畫面</text><text x="700" y="618" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">不亮先回左欄，慢或 RAM 不夠再調右欄</text><path d="M580,420 L618,420" fill="none" stroke="#173047" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="668" font-size="20" fill="#173047" font-weight="bold" text-anchor="start">組合結果範例（同一片 0.96 吋 4 腳 SSD1306）</text><rect x="40" y="686" width="1120" height="38" rx="6" fill="#fff" stroke="#d9e2eb" stroke-width="1"/><text x="56" y="712" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">Uno R3（2 KiB SRAM），要圖形</text><text x="470" y="712" font-size="18" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">U8G2_SSD1306_128X64_NONAME_1_HW_I2C</text><rect x="40" y="730" width="1120" height="38" rx="6" fill="#fff" stroke="#d9e2eb" stroke-width="1"/><text x="56" y="756" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">NodeMCU-32S，要曲線／動畫</text><text x="470" y="756" font-size="18" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">U8G2_SSD1306_128X64_NONAME_F_HW_I2C</text><rect x="40" y="774" width="1120" height="38" rx="6" fill="#fff" stroke="#d9e2eb" stroke-width="1"/><text x="56" y="800" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">任何板子，只顯示溫度文字</text><text x="470" y="800" font-size="18" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">U8X8_SSD1306_128X64_NONAME_HW_I2C</text><text x="40" y="840" font-size="16" fill="#087e82" font-weight="bold" text-anchor="start">硬體段（SSD1306_128X64_NONAME_…_HW_I2C）三種情境都一樣；只有需求段（U8G2／U8X8、_1／_F）不同。</text></g></svg>
