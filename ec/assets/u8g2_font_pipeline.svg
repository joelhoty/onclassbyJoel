<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 405" role="img" aria-label="UTF-8 與字型處理流程"><title>UTF-8 與字型處理流程</title><metadata>{&quot;updated&quot;: &quot;2026-10-27 16:07:29 (UTC+8)&quot;, &quot;model&quot;: &quot;GPT-6&quot;, &quot;agent&quot;: &quot;Codex /root&quot;, &quot;Prompt Archive&quot;: [&quot;針對u8g2程式庫完整的說明，包含u8g2有許多種不同的螢幕顯示方式  u8x8, page_buffer,full_buffer等，分別針對這些顯示方法進行詳細比較與範例說明，並配合適用在那些開發版(記憶體限制考量)&quot;, &quot;加入nodemcu32s這個開發版&quot;, &quot;page_buffer, full_buffer的比較與詳細說明範例(圖解釋)&quot;, &quot;增加u8g2 font與符號 多語言的顯示說明&quot;, &quot;file:///D:/CLASS_NOTE/ec/u8g2_display_modes_comparison.md 參考這一份檔案，將你沒有考慮到的資訊 增加進來‘‘並確認資訊與敘述正確&quot;]}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><rect x="1" y="1" width="1198" height="403" rx="18" fill="#f5f8fb" stroke="#d9e2eb"/><text x="35" y="45" font-size="27" fill="#173047" font-weight="bold" text-anchor="start">文字 → UTF-8 解碼 → 查找字型 → 像素 → 畫面</text><rect x="30" y="100" width="210" height="150" rx="12" fill="#fff" stroke="#087e82"/><text x="135" y="137" font-size="19" fill="#087e82" font-weight="bold" text-anchor="middle">UTF-8 字串</text><text x="135" y="180" font-size="18" fill="#173047" font-weight="normal" text-anchor="middle">「溫」</text><text x="135" y="218" font-size="15" fill="#173047" font-weight="normal" text-anchor="middle">E6 BA AB</text><path d="M242,175 L262,175" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="265" y="100" width="210" height="150" rx="12" fill="#fff" stroke="#087e82"/><text x="370" y="137" font-size="19" fill="#087e82" font-weight="bold" text-anchor="middle">Unicode 碼點</text><text x="370" y="180" font-size="18" fill="#173047" font-weight="normal" text-anchor="middle">U+6EAB</text><text x="370" y="218" font-size="15" fill="#173047" font-weight="normal" text-anchor="middle">不是單一 byte</text><path d="M477,175 L497,175" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="500" y="100" width="210" height="150" rx="12" fill="#fff" stroke="#087e82"/><text x="605" y="137" font-size="19" fill="#087e82" font-weight="bold" text-anchor="middle">目前字型</text><text x="605" y="180" font-size="18" fill="#173047" font-weight="normal" text-anchor="middle">有此 glyph？</text><text x="605" y="218" font-size="15" fill="#173047" font-weight="normal" text-anchor="middle">缺字要換字型／子集</text><path d="M712,175 L732,175" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="735" y="100" width="210" height="150" rx="12" fill="#fff" stroke="#087e82"/><text x="840" y="137" font-size="19" fill="#087e82" font-weight="bold" text-anchor="middle">點陣像素</text><text x="840" y="180" font-size="18" fill="#173047" font-weight="normal" text-anchor="middle">字形、基線、寬度</text><text x="840" y="218" font-size="15" fill="#173047" font-weight="normal" text-anchor="middle">不是自動多語排版</text><path d="M947,175 L967,175" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="970" y="100" width="210" height="150" rx="12" fill="#fff" stroke="#087e82"/><text x="1075" y="137" font-size="19" fill="#087e82" font-weight="bold" text-anchor="middle">畫面 buffer</text><text x="1075" y="180" font-size="18" fill="#173047" font-weight="normal" text-anchor="middle">Page 或 Full</text><text x="1075" y="218" font-size="15" fill="#173047" font-weight="normal" text-anchor="middle">影響 SRAM 與繪圖次數</text><rect x="30" y="285" width="1140" height="92" rx="12" fill="#fff7e4" stroke="#e9bf64"/><text x="52" y="319" font-size="21" fill="#173047" font-weight="bold" text-anchor="start">enableUTF8Print() 解決 print 的解碼，不會讓字型自動長出缺少的字。</text><text x="52" y="351" font-size="19" fill="#173047" font-weight="normal" text-anchor="start">字庫主要占 Flash；Page Buffer 節省的是像素 SRAM。這兩種容量要分開估算。</text></g></svg>