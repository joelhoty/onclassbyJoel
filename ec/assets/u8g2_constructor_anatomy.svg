<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="U8g2 建構式名稱與參數解剖"><title>U8g2 建構式名稱與參數解剖</title><metadata>{&quot;updated&quot;: &quot;2026-10-27 17:50:55 (UTC+8)&quot;, &quot;model&quot;: &quot;Claude Opus 5.5&quot;, &quot;agent&quot;: &quot;Claude Code&quot;, &quot;Prompt Archive&quot;: [&quot;ec/u8g2_display_modes_memory_guide.md 檢視這份資料，並補充 class construct _1 _2的說明，並在解說與範例加上適合的圖形解說&quot;, &quot;建構式與硬體ssd 1306為例 要如何選擇？根據需求還是根據硬體的規格&quot;]}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><rect x="1" y="1" width="1198" height="758" rx="18" fill="#f5f8fb" stroke="#d9e2eb" stroke-width="1.5"/><text x="40" y="50" font-size="28" fill="#173047" font-weight="bold" text-anchor="start">建構式名稱解剖：一個類別名稱 = 六個選擇</text><text x="40" y="82" font-size="16" fill="#55697c" font-weight="normal" text-anchor="start">顏色代表誰決定：綠＝硬體規格、藍＝硬體接腳＋開發板、橘＝需求與 RAM。選錯綠色段通常不亮或亂碼；橘色段選錯只影響 RAM 與寫法。</text><rect x="60" y="114" width="108" height="52" rx="9" fill="#c47a00" stroke="#c47a00" stroke-width="1.5"/><text x="114.0" y="150" font-size="30" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">U8G2</text><path d="M114.0,168 L114.0,200 L126.0,200 L126.0,228" fill="none" stroke="#c47a00" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="230" width="172" height="150" rx="12" fill="#fff" stroke="#c47a00" stroke-width="2"/><text x="54" y="260" font-size="18" fill="#c47a00" font-weight="bold" text-anchor="start">API 種類</text><text x="54" y="290" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">U8G2＝像素圖形</text><text x="54" y="316" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">U8X8＝文字 tile</text><text x="54" y="366" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">依需求選</text><text x="181.0" y="150" font-size="30" fill="#55697c" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">_</text><rect x="194" y="114" width="171" height="52" rx="9" fill="#087e82" stroke="#087e82" stroke-width="1.5"/><text x="279.5" y="150" font-size="30" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">SSD1306</text><path d="M279.5,168 L279.5,200 L314.0,200 L314.0,228" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/><rect x="228" y="230" width="172" height="150" rx="12" fill="#fff" stroke="#087e82" stroke-width="2"/><text x="242" y="260" font-size="18" fill="#087e82" font-weight="bold" text-anchor="start">控制器晶片</text><text x="242" y="290" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">看模組規格／背面</text><text x="242" y="316" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">SH1106 不能混用</text><text x="242" y="366" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">依硬體選</text><text x="378.0" y="150" font-size="30" fill="#55697c" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">_</text><rect x="391" y="114" width="150" height="52" rx="9" fill="#087e82" stroke="#087e82" stroke-width="1.5"/><text x="466.0" y="150" font-size="30" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">128X64</text><path d="M466.0,168 L466.0,200 L502.0,200 L502.0,228" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/><rect x="416" y="230" width="172" height="150" rx="12" fill="#fff" stroke="#087e82" stroke-width="2"/><text x="430" y="260" font-size="18" fill="#087e82" font-weight="bold" text-anchor="start">解析度</text><text x="430" y="290" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">像素 寬×高</text><text x="430" y="316" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">128X32 是另一類別</text><text x="430" y="366" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">依硬體選</text><text x="554.0" y="150" font-size="30" fill="#55697c" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">_</text><rect x="567" y="114" width="150" height="52" rx="9" fill="#087e82" stroke="#087e82" stroke-width="1.5"/><text x="642.0" y="150" font-size="30" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">NONAME</text><path d="M642.0,168 L642.0,200 L690.0,200 L690.0,228" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/><rect x="604" y="230" width="172" height="150" rx="12" fill="#fff" stroke="#087e82" stroke-width="2"/><text x="618" y="260" font-size="18" fill="#087e82" font-weight="bold" text-anchor="start">模組變體</text><text x="618" y="290" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">初始化命令不同</text><text x="618" y="316" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">先試 NONAME</text><text x="618" y="366" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">依實測選</text><text x="730.0" y="150" font-size="30" fill="#55697c" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">_</text><rect x="743" y="114" width="45" height="52" rx="9" fill="#c47a00" stroke="#c47a00" stroke-width="1.5"/><text x="765.5" y="150" font-size="30" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">1</text><path d="M765.5,168 L765.5,200 L878.0,200 L878.0,228" fill="none" stroke="#c47a00" stroke-width="2" marker-end="url(#arrow)"/><rect x="792" y="230" width="172" height="150" rx="12" fill="#fff" stroke="#c47a00" stroke-width="2"/><text x="806" y="260" font-size="18" fill="#c47a00" font-weight="bold" text-anchor="start">緩衝模式</text><text x="806" y="290" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">_1＝128 B</text><text x="806" y="316" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">_2＝256 B／_F＝1 KiB</text><text x="806" y="366" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">依 RAM 與需求</text><text x="801.0" y="150" font-size="30" fill="#55697c" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">_</text><rect x="814" y="114" width="150" height="52" rx="9" fill="#2458b8" stroke="#2458b8" stroke-width="1.5"/><text x="889.0" y="150" font-size="30" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Consolas,Cascadia Code,Menlo,monospace">HW_I2C</text><path d="M889.0,168 L889.0,200 L1066.0,200 L1066.0,228" fill="none" stroke="#2458b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="980" y="230" width="172" height="150" rx="12" fill="#fff" stroke="#2458b8" stroke-width="2"/><text x="994" y="260" font-size="18" fill="#2458b8" font-weight="bold" text-anchor="start">通訊介面</text><text x="994" y="290" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">模組 4 腳＝I²C</text><text x="994" y="316" font-size="15" fill="#173047" font-weight="normal" text-anchor="start">7 腳＝SPI</text><text x="994" y="366" font-size="14" fill="#55697c" font-weight="normal" text-anchor="start">依接腳選</text><text x="40" y="418" font-size="20" fill="#173047" font-weight="bold" text-anchor="start">宣告物件時：類別名稱是「型別」，括號內是建構式參數（HW_I2C 版本）</text><rect x="40" y="438" width="1120" height="50" rx="10" fill="#12283a" stroke="#12283a" stroke-width="1.5"/><text x="64" y="470" font-size="24" fill="#e1eef7" font-family="Consolas,Cascadia Code,Menlo,monospace" textLength="1051.2" lengthAdjust="spacingAndGlyphs">U8G2_SSD1306_128X64_NONAME_1_HW_I2C u8g2(U8G2_R0, U8X8_PIN_NONE, 22, 21);</text><path d="M64.0,492 L64.0,500 L568.0,500 L568.0,492" fill="none" stroke="#c47a00" stroke-width="2"/><text x="316.0" y="522" font-size="15" fill="#c47a00" font-weight="bold" text-anchor="middle">類別（型別）</text><path d="M582.4,526 L582.4,534 L640.0,534 L640.0,526" fill="none" stroke="#2458b8" stroke-width="2"/><text x="611.2" y="556" font-size="15" fill="#2458b8" font-weight="bold" text-anchor="middle">物件名稱</text><path d="M654.4,492 L654.4,500 L755.2,500 L755.2,492" fill="none" stroke="#087e82" stroke-width="2"/><text x="704.8" y="522" font-size="15" fill="#087e82" font-weight="bold" text-anchor="middle">旋轉 rotation</text><path d="M784.0,526 L784.0,534 L971.2,534 L971.2,526" fill="none" stroke="#087e82" stroke-width="2"/><text x="877.6" y="556" font-size="15" fill="#087e82" font-weight="bold" text-anchor="middle">reset 腳</text><path d="M1000.0,492 L1000.0,500 L1028.8000000000002,500 L1028.8000000000002,492" fill="none" stroke="#087e82" stroke-width="2"/><text x="1014.4000000000001" y="522" font-size="15" fill="#087e82" font-weight="bold" text-anchor="middle">clock＝SCL</text><path d="M1057.6,526 L1057.6,534 L1086.4,534 L1086.4,526" fill="none" stroke="#087e82" stroke-width="2"/><text x="1072.0" y="556" font-size="15" fill="#087e82" font-weight="bold" text-anchor="middle">data＝SDA</text><text x="40" y="600" font-size="20" fill="#173047" font-weight="bold" text-anchor="start">同一個 OLED，不同介面的參數順序不一樣（U8g2 2.36.19 標頭）</text><rect x="40" y="622" width="1120" height="38" rx="6" fill="#fff" stroke="#d9e2eb" stroke-width="1"/><text x="56" y="648" font-size="17" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">…_HW_I2C</text><text x="240" y="648" font-size="17" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">(rotation, reset, clock, data)</text><text x="640" y="648" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">後三個可省略；省略腳位＝使用板子預設 Wire 腳</text><rect x="40" y="666" width="1120" height="38" rx="6" fill="#eef4f8" stroke="#d9e2eb" stroke-width="1"/><text x="56" y="692" font-size="17" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">…_SW_I2C</text><text x="240" y="692" font-size="17" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">(rotation, clock, data, reset)</text><text x="640" y="692" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">clock、data 必填；任意 GPIO，速度較慢</text><rect x="40" y="710" width="1120" height="38" rx="6" fill="#fff" stroke="#d9e2eb" stroke-width="1"/><text x="56" y="736" font-size="17" fill="#2458b8" font-weight="bold" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">…_4W_HW_SPI</text><text x="240" y="736" font-size="17" fill="#173047" font-weight="normal" text-anchor="start" font-family="Consolas,Cascadia Code,Menlo,monospace">(rotation, cs, dc, reset)</text><text x="640" y="736" font-size="15" fill="#55697c" font-weight="normal" text-anchor="start">SCK／MOSI 用板子硬體 SPI 腳，不在參數中</text></g></svg>
