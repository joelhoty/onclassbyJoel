<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 935" role="img" aria-label="Page Buffer 與 Full Buffer 比較"><title>Page Buffer 與 Full Buffer 比較</title><metadata>{&quot;updated&quot;: &quot;2026-10-27 16:07:29 (UTC+8)&quot;, &quot;model&quot;: &quot;GPT-6&quot;, &quot;agent&quot;: &quot;Codex /root&quot;, &quot;Prompt Archive&quot;: [&quot;針對u8g2程式庫完整的說明，包含u8g2有許多種不同的螢幕顯示方式  u8x8, page_buffer,full_buffer等，分別針對這些顯示方法進行詳細比較與範例說明，並配合適用在那些開發版(記憶體限制考量)&quot;, &quot;加入nodemcu32s這個開發版&quot;, &quot;page_buffer, full_buffer的比較與詳細說明範例(圖解釋)&quot;, &quot;增加u8g2 font與符號 多語言的顯示說明&quot;, &quot;file:///D:/CLASS_NOTE/ec/u8g2_display_modes_comparison.md 參考這一份檔案，將你沒有考慮到的資訊 增加進來‘‘並確認資訊與敘述正確&quot;]}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><rect x="1" y="1" width="1198" height="933" rx="18" fill="#f5f8fb" stroke="#d9e2eb"/><text x="40" y="48" font-size="28" fill="#173047" font-weight="bold" text-anchor="start">同一張 128 × 64 單色畫面，兩種 RAM 工作方式</text><text x="40" y="80" font-size="18" fill="#173047" font-weight="normal" text-anchor="start">最終像素可以相同；差異在工作區容量、場景執行次數與傳送次序。</text><rect x="35" y="110" width="550" height="690" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="59" y="150" font-size="23" fill="#087e82" font-weight="bold" text-anchor="start">PAGE BUFFER  _1_</text><text x="59" y="183" font-size="19" fill="#173047" font-weight="normal" text-anchor="start">MCU RAM：128 bytes，只保存一段</text><rect x="60" y="210" width="360" height="22" rx="2" fill="#edf1f5" stroke="#fff"/><text x="433" y="226" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=00–07</text><rect x="60" y="234" width="360" height="22" rx="2" fill="#edf1f5" stroke="#fff"/><text x="433" y="250" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=08–15</text><rect x="60" y="258" width="360" height="22" rx="2" fill="#087e82" stroke="#fff"/><text x="433" y="274" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=16–23</text><rect x="60" y="282" width="360" height="22" rx="2" fill="#edf1f5" stroke="#fff"/><text x="433" y="298" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=24–31</text><rect x="60" y="306" width="360" height="22" rx="2" fill="#edf1f5" stroke="#fff"/><text x="433" y="322" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=32–39</text><rect x="60" y="330" width="360" height="22" rx="2" fill="#edf1f5" stroke="#fff"/><text x="433" y="346" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=40–47</text><rect x="60" y="354" width="360" height="22" rx="2" fill="#edf1f5" stroke="#fff"/><text x="433" y="370" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=48–55</text><rect x="60" y="378" width="360" height="22" rx="2" fill="#edf1f5" stroke="#fff"/><text x="433" y="394" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=56–63</text><text x="60" y="429" font-size="16" fill="#087e82" font-weight="normal" text-anchor="start">綠色條可對應任何頁；灰色區不占 buffer</text><path d="M310,447 L310,479" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="494" width="500" height="72" rx="12" fill="#e5f5f2" stroke="#087e82"/><text x="80" y="524" font-size="22" fill="#087e82" font-weight="bold" text-anchor="start">drawScene() × 8</text><text x="80" y="551" font-size="17" fill="#173047" font-weight="normal" text-anchor="start">每次呼叫整個場景，自動裁切當前頁</text><path d="M310,578 L310,608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="60" y="640" font-size="18" fill="#173047" font-weight="bold" text-anchor="start">nextPage() 逐頁傳送，重用同一塊 RAM</text><rect x="60" y="660" width="54" height="44" rx="5" fill="#e5f5f2" stroke="#087e82"/><text x="87" y="688" font-size="17" fill="#087e82" font-weight="normal" text-anchor="middle">1</text><rect x="122" y="660" width="54" height="44" rx="5" fill="#e5f5f2" stroke="#087e82"/><text x="149" y="688" font-size="17" fill="#087e82" font-weight="normal" text-anchor="middle">2</text><rect x="184" y="660" width="54" height="44" rx="5" fill="#e5f5f2" stroke="#087e82"/><text x="211" y="688" font-size="17" fill="#087e82" font-weight="normal" text-anchor="middle">3</text><rect x="246" y="660" width="54" height="44" rx="5" fill="#e5f5f2" stroke="#087e82"/><text x="273" y="688" font-size="17" fill="#087e82" font-weight="normal" text-anchor="middle">4</text><rect x="308" y="660" width="54" height="44" rx="5" fill="#e5f5f2" stroke="#087e82"/><text x="335" y="688" font-size="17" fill="#087e82" font-weight="normal" text-anchor="middle">5</text><rect x="370" y="660" width="54" height="44" rx="5" fill="#e5f5f2" stroke="#087e82"/><text x="397" y="688" font-size="17" fill="#087e82" font-weight="normal" text-anchor="middle">6</text><rect x="432" y="660" width="54" height="44" rx="5" fill="#e5f5f2" stroke="#087e82"/><text x="459" y="688" font-size="17" fill="#087e82" font-weight="normal" text-anchor="middle">7</text><rect x="494" y="660" width="54" height="44" rx="5" fill="#e5f5f2" stroke="#087e82"/><text x="521" y="688" font-size="17" fill="#087e82" font-weight="normal" text-anchor="middle">8</text><text x="60" y="735" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">8 段 × 128 B = 約 1,024 B 像素資料</text><text x="60" y="769" font-size="19" fill="#087e82" font-weight="bold" text-anchor="start">較少 SRAM，較多場景呼叫</text><rect x="615" y="110" width="550" height="690" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="639" y="150" font-size="23" fill="#2458b8" font-weight="bold" text-anchor="start">FULL BUFFER  _F_</text><text x="639" y="183" font-size="19" fill="#173047" font-weight="normal" text-anchor="start">MCU RAM：1,024 bytes，保存整屏</text><rect x="640" y="210" width="360" height="22" rx="2" fill="#2458b8" stroke="#fff"/><text x="1013" y="226" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=00–07</text><rect x="640" y="234" width="360" height="22" rx="2" fill="#2458b8" stroke="#fff"/><text x="1013" y="250" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=08–15</text><rect x="640" y="258" width="360" height="22" rx="2" fill="#2458b8" stroke="#fff"/><text x="1013" y="274" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=16–23</text><rect x="640" y="282" width="360" height="22" rx="2" fill="#2458b8" stroke="#fff"/><text x="1013" y="298" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=24–31</text><rect x="640" y="306" width="360" height="22" rx="2" fill="#2458b8" stroke="#fff"/><text x="1013" y="322" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=32–39</text><rect x="640" y="330" width="360" height="22" rx="2" fill="#2458b8" stroke="#fff"/><text x="1013" y="346" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=40–47</text><rect x="640" y="354" width="360" height="22" rx="2" fill="#2458b8" stroke="#fff"/><text x="1013" y="370" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=48–55</text><rect x="640" y="378" width="360" height="22" rx="2" fill="#2458b8" stroke="#fff"/><text x="1013" y="394" font-size="14" fill="#173047" font-weight="normal" text-anchor="start">y=56–63</text><text x="640" y="429" font-size="16" fill="#2458b8" font-weight="normal" text-anchor="start">所有色塊同時存在 RAM</text><path d="M890,447 L890,479" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="640" y="494" width="500" height="72" rx="12" fill="#e9effc" stroke="#2458b8"/><text x="660" y="524" font-size="22" fill="#2458b8" font-weight="bold" text-anchor="start">drawScene() × 1</text><text x="660" y="551" font-size="17" fill="#173047" font-weight="normal" text-anchor="start">一次完成所有像素</text><path d="M890,578 L890,608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="640" y="640" font-size="18" fill="#173047" font-weight="bold" text-anchor="start">sendBuffer() 傳送全屏</text><rect x="640" y="660" width="54" height="44" rx="5" fill="#e9effc" stroke="#2458b8"/><text x="667" y="688" font-size="17" fill="#2458b8" font-weight="normal" text-anchor="middle">1</text><rect x="702" y="660" width="54" height="44" rx="5" fill="#e9effc" stroke="#2458b8"/><text x="729" y="688" font-size="17" fill="#2458b8" font-weight="normal" text-anchor="middle">2</text><rect x="764" y="660" width="54" height="44" rx="5" fill="#e9effc" stroke="#2458b8"/><text x="791" y="688" font-size="17" fill="#2458b8" font-weight="normal" text-anchor="middle">3</text><rect x="826" y="660" width="54" height="44" rx="5" fill="#e9effc" stroke="#2458b8"/><text x="853" y="688" font-size="17" fill="#2458b8" font-weight="normal" text-anchor="middle">4</text><rect x="888" y="660" width="54" height="44" rx="5" fill="#e9effc" stroke="#2458b8"/><text x="915" y="688" font-size="17" fill="#2458b8" font-weight="normal" text-anchor="middle">5</text><rect x="950" y="660" width="54" height="44" rx="5" fill="#e9effc" stroke="#2458b8"/><text x="977" y="688" font-size="17" fill="#2458b8" font-weight="normal" text-anchor="middle">6</text><rect x="1012" y="660" width="54" height="44" rx="5" fill="#e9effc" stroke="#2458b8"/><text x="1039" y="688" font-size="17" fill="#2458b8" font-weight="normal" text-anchor="middle">7</text><rect x="1074" y="660" width="54" height="44" rx="5" fill="#e9effc" stroke="#2458b8"/><text x="1101" y="688" font-size="17" fill="#2458b8" font-weight="normal" text-anchor="middle">8</text><text x="640" y="735" font-size="16" fill="#173047" font-weight="normal" text-anchor="start">總像素資料約 1,024 B；仍會分包／逐段傳送</text><text x="640" y="769" font-size="19" fill="#2458b8" font-weight="bold" text-anchor="start">較少重複繪圖，較多 SRAM</text><rect x="35" y="823" width="1130" height="87" rx="12" fill="#fff7e4" stroke="#e9bf64"/><text x="55" y="853" font-size="19" fill="#173047" font-weight="bold" text-anchor="start">_2_ = 256 B 單一工作區、每次 16 列、場景呼叫 4 次；不是雙畫面緩衝。</text><text x="55" y="883" font-size="17" fill="#173047" font-weight="normal" text-anchor="start">Page 與 Full 全屏更新的像素總量相近；Full 不代表面板能原子切換整張畫面。</text></g></svg>