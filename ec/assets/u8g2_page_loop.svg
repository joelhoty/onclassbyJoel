<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-label="Page loop 資料快照圖解"><title>Page loop 資料快照圖解</title><metadata>{&quot;updated&quot;: &quot;2026-10-27 16:07:29 (UTC+8)&quot;, &quot;model&quot;: &quot;GPT-6&quot;, &quot;agent&quot;: &quot;Codex /root&quot;, &quot;Prompt Archive&quot;: [&quot;針對u8g2程式庫完整的說明，包含u8g2有許多種不同的螢幕顯示方式  u8x8, page_buffer,full_buffer等，分別針對這些顯示方法進行詳細比較與範例說明，並配合適用在那些開發版(記憶體限制考量)&quot;, &quot;加入nodemcu32s這個開發版&quot;, &quot;page_buffer, full_buffer的比較與詳細說明範例(圖解釋)&quot;, &quot;增加u8g2 font與符號 多語言的顯示說明&quot;, &quot;file:///D:/CLASS_NOTE/ec/u8g2_display_modes_comparison.md 參考這一份檔案，將你沒有考慮到的資訊 增加進來‘‘並確認資訊與敘述正確&quot;]}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,Arial,sans-serif"><rect x="1" y="1" width="1198" height="708" rx="18" fill="#f5f8fb" stroke="#d9e2eb"/><text x="35" y="45" font-size="27" fill="#173047" font-weight="bold" text-anchor="start">分頁迴圈：完成同一張畫面，不是產生八張動畫</text><text x="35" y="79" font-size="19" fill="#173047" font-weight="normal" text-anchor="start">先讀取資料快照，再用同一份資料重畫所有頁。</text><rect x="35" y="110" width="1130" height="78" rx="12" fill="#e5f5f2" stroke="#087e82"/><text x="60" y="143" font-size="21" fill="#173047" font-weight="bold" text-anchor="start">① 取樣一次：value = 64；先格式化文字、固定動畫位置。</text><text x="60" y="172" font-size="17" fill="#173047" font-weight="normal" text-anchor="start">② firstPage() → 進入 picture loop；此後不再取樣、不再改變畫面資料。</text><rect x="38" y="230" width="128" height="165" rx="12" fill="#fff" stroke="#087e82"/><text x="102" y="260" font-size="18" fill="#087e82" font-weight="bold" text-anchor="middle">第 1 頁</text><rect x="58" y="278" width="88" height="7" rx="0" fill="#087e82" stroke="#fff"/><rect x="58" y="287" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="58" y="296" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="58" y="305" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="58" y="314" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="58" y="323" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="58" y="332" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="58" y="341" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><text x="102" y="377" font-size="16" fill="#173047" font-weight="normal" text-anchor="middle">value=64</text><path d="M167,313 L179,313" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="181" y="230" width="128" height="165" rx="12" fill="#fff" stroke="#087e82"/><text x="245" y="260" font-size="18" fill="#087e82" font-weight="bold" text-anchor="middle">第 2 頁</text><rect x="201" y="278" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="201" y="287" width="88" height="7" rx="0" fill="#087e82" stroke="#fff"/><rect x="201" y="296" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="201" y="305" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="201" y="314" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="201" y="323" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="201" y="332" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="201" y="341" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><text x="245" y="377" font-size="16" fill="#173047" font-weight="normal" text-anchor="middle">value=64</text><path d="M310,313 L322,313" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="324" y="230" width="128" height="165" rx="12" fill="#fff" stroke="#087e82"/><text x="388" y="260" font-size="18" fill="#087e82" font-weight="bold" text-anchor="middle">第 3 頁</text><rect x="344" y="278" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="344" y="287" width="88" height="7" rx="0" fill="#e7edf3" str