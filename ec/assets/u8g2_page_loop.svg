e7edf3" stroke="#fff"/><rect x="630" y="287" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="630" y="296" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="630" y="305" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="630" y="314" width="88" height="7" rx="0" fill="#087e82" stroke="#fff"/><rect x="630" y="323" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="630" y="332" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="630" y="341" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><text x="674" y="377" font-size="16" fill="#173047" font-weight="normal" text-anchor="middle">value=64</text><path d="M739,313 L751,313" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="753" y="230" width="128" height="165" rx="12" fill="#fff" stroke="#087e82"/><text x="817" y="260" font-size="18" fill="#087e82" font-weight="bold" text-anchor="middle">第 6 頁</text><rect x="773" y="278" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="773" y="287" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="773" y="296" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="773" y="305" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="773" y="314" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="773" y="323" width="88" height="7" rx="0" fill="#087e82" stroke="#fff"/><rect x="773" y="332" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="773" y="341" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><text x="817" y="377" font-size="16" fill="#173047" font-weight="normal" text-anchor="middle">value=64</text><path d="M882,313 L894,313" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="896" y="230" width="128" height="165" rx="12" fill="#fff" stroke="#087e82"/><text x="960" y="260" font-size="18" fill="#087e82" font-weight="bold" text-anchor="middle">第 7 頁</text><rect x="916" y="278" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="916" y="287" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="916" y="296" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="916" y="305" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="916" y="314" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="916" y="323" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="916" y="332" width="88" height="7" rx="0" fill="#087e82" stroke="#fff"/><rect x="916" y="341" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><text x="960" y="377" font-size="16" fill="#173047" font-weight="normal" text-anchor="middle">value=64</text><path d="M1025,313 L1037,313" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1039" y="230" width="128" height="165" rx="12" fill="#fff" stroke="#087e82"/><text x="1103" y="260" font-size="18" fill="#087e82" font-weight="bold" text-anchor="middle">第 8 頁</text><rect x="1059" y="278" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="1059" y="287" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="1059" y="296" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="1059" y="305" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="1059" y="314" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="1059" y="323" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="1059" y="332" width="88" height="7" rx="0" fill="#e7edf3" stroke="#fff"/><rect x="1059" y="341" width="88" height="7" rx="0" fill="#087e82" stroke="#fff"/><text x="1103" y="377" font-size="16" fill="#173047" font-weight="normal" text-anchor="middle">value=64</text><text x="45" y="434" font-size="21" fill="#173047" font-weight="bold" text-anchor="start">每頁：drawScene(64) → 只留下當前頁像素 → nextPage() 送出與換頁</text><rect x="35" y="470" width="1130" height="71" rx="12" fill="#e9effc" stroke="#2458b8"/><text x="60" y="500" font-size="21" fill="#2458b8" font-weight="bold" text-anchor="start">③ 八頁完成後，才允許更新下一影格，例如 value = 65。</text><text x="60" y="526" font-size="17" fill="#173047" font-weight="normal" text-anchor="start">延遲、感測器讀取、網路請求也應放在 picture loop 外。</text><rect x="35" y="573" width="1130" height="113" rx="12" fill="#fff1ef" stroke="#d67b69"/><text x="60" y="606" font-size="21" fill="#ad3926" font-weight="bold" text-anchor="start">錯誤示意：每頁讀值 64 → 65 → 66 → 67 → …</text><text x="60" y="637" font-size="18" fill="#173047" font-weight="normal" text-anchor="start">同一個數字／長條的不同水平區段可能來自不同資料，最後產生接縫。</text><text x="60" y="665" font-size="17" fill="#173047" font-weight="normal" text-anchor="start">快照保證場景一致；不代表匯流排或 OLED 面板在同一瞬間更新所有像素。</text></g></svg>