<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 770" width="100%" font-family="Microsoft JhengHei,Segoe UI,Arial,sans-serif">
<rect width="1240" height="770" fill="#ffffff"/>
<text x="620.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">建議最終公式（EV3 基本積木）：距離 → 功率</text>
<text x="30" y="70" font-size="15" font-weight="700" fill="#0369a1">① 感測 ＋ ② 算功率：speed = 15 + 1.3 × (dist − 15)</text>
<rect x="30" y="85" width="118" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="30" y="85" width="118" height="24" rx="8" fill="#facc15"/><rect x="30" y="97" width="118" height="12" fill="#facc15"/>
<text x="89.0" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">超音波</text>
<text x="89.0" y="133" text-anchor="middle" font-size="13" fill="#0f172a">測量·公分</text>
<text x="89.0" y="153" text-anchor="middle" font-size="13" fill="#0f172a">Port 4</text>
<rect x="168" y="85" width="118" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="168" y="85" width="118" height="24" rx="8" fill="#dc2626"/><rect x="168" y="97" width="118" height="12" fill="#dc2626"/>
<text x="227.0" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">變數·寫入</text>
<text x="227.0" y="133" text-anchor="middle" font-size="13" fill="#0f172a">dist</text>
<text x="227.0" y="153" text-anchor="middle" font-size="13" fill="#0f172a">← 測距值</text>
<rect x="306" y="85" width="118" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="306" y="85" width="118" height="24" rx="8" fill="#dc2626"/><rect x="306" y="97" width="118" height="12" fill="#dc2626"/>
<text x="365.0" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Math（基本）</text>
<text x="365.0" y="133" text-anchor="middle" font-size="13" fill="#0f172a">a − b</text>
<text x="365.0" y="153" text-anchor="middle" font-size="13" fill="#0f172a">a←dist, b=15</text>
<rect x="444" y="85" width="118" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="444" y="85" width="118" height="24" rx="8" fill="#dc2626"/><rect x="444" y="97" width="118" height="12" fill="#dc2626"/>
<text x="503.0" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Math（基本）</text>
<text x="503.0" y="133" text-anchor="middle" font-size="13" fill="#0f172a">a × b</text>
<text x="503.0" y="153" text-anchor="middle" font-size="13" fill="#0f172a">b = 1.3</text>
<rect x="582" y="85" width="118" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="582" y="85" width="118" height="24" rx="8" fill="#dc2626"/><rect x="582" y="97" width="118" height="12" fill="#dc2626"/>
<text x="641.0" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Math（基本）</text>
<text x="641.0" y="133" text-anchor="middle" font-size="13" fill="#0f172a">a + b</text>
<text x="641.0" y="153" text-anchor="middle" font-size="13" fill="#0f172a">b = 15</text>
<rect x="720" y="85" width="118" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="720" y="85" width="118" height="24" rx="8" fill="#dc2626"/><rect x="720" y="97" width="118" height="12" fill="#dc2626"/>
<text x="779.0" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">變數·寫入</text>
<text x="779.0" y="133" text-anchor="middle" font-size="13" fill="#0f172a">speed</text>
<text x="779.0" y="153" text-anchor="middle" font-size="13" fill="#0f172a">← 結果</text>
<polyline points="89,177 89,193 227,193 227,177" fill="none" stroke="#eab308" stroke-width="3"/>
<polyline points="365,177 365,193 503,193 503,177" fill="none" stroke="#eab308" stroke-width="3"/>
<polyline points="503,177 503,193 641,193 641,177" fill="none" stroke="#eab308" stroke-width="3"/>
<polyline points="641,177 641,193 779,193 779,177" fill="none" stroke="#eab308" stroke-width="3"/>
<text x="852" y="125" font-size="12" fill="#475569">此時 speed 可能 &gt; 60</text>
<text x="852" y="145" font-size="12" fill="#475569">dist &lt; 15 時 &lt; 15</text>
<text x="30" y="232" font-size="15" font-weight="700" fill="#0369a1">③ 上限：speed &gt; 60 就改成 60（P_MAX）</text>
<rect x="30" y="248" width="104" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="30" y="248" width="104" height="24" rx="8" fill="#dc2626"/><rect x="30" y="260" width="104" height="12" fill="#dc2626"/>
<text x="82.0" y="265" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">變數·讀取</text>
<text x="82.0" y="296" text-anchor="middle" font-size="13" fill="#0f172a">speed</text>
<rect x="144" y="248" width="104" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="144" y="248" width="104" height="24" rx="8" fill="#dc2626"/><rect x="144" y="260" width="104" height="12" fill="#dc2626"/>
<text x="196.0" y="265" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">比較</text>
<text x="196.0" y="296" text-anchor="middle" font-size="13" fill="#0f172a">a &gt; b</text>
<text x="196.0" y="316" text-anchor="middle" font-size="13" fill="#0f172a">b = 60</text>
<polyline points="82,340 82,356 196,356 196,340" fill="none" stroke="#eab308" stroke-width="3"/>
<rect x="330" y="238" width="340" height="232" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
<text x="342" y="260" font-size="13" font-weight="700" fill="#92400e">切換（邏輯）← 比較結果</text>
<rect x="342" y="272" width="316" height="88.0" rx="8" fill="#ffffff" stroke="#fcd34d"/>
<text x="352" y="292" font-size="15" fill="#16a34a" font-weight="700">✓ 成立</text>
<rect x="430" y="276" width="118" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="430" y="276" width="118" height="24" rx="8" fill="#dc2626"/><rect x="430" y="288" width="118" height="12" fill="#dc2626"/>
<text x="489.0" y="293" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">變數·寫入</text>
<text x="489.0" y="324" text-anchor="middle" font-size="13" fill="#0f172a">speed</text>
<text x="489.0" y="344" text-anchor="middle" font-size="13" fill="#0f172a">← 60</text>
<rect x="342" y="368.0" width="316" height="88.0" rx="8" fill="#ffffff" stroke="#fcd34d"/>
<text x="352" y="388.0" font-size="15" fill="#dc2626" font-weight="700">✗ 不成立</text>
<rect x="430" y="372.0" width="118" height="76" rx="8" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="489.0" y="415.0" text-anchor="middle" font-size="13" fill="#94a3b8">（空，什麼都不做）</text>
<polyline points="248,294 330,294" stroke="#f59e0b" stroke-width="3" fill="none"/>
<text x="30" y="504" font-size="15" font-weight="700" fill="#0369a1">④ 停車線：dist &lt; 15 就改成 0（D_STOP）</text>
<rect x="30" y="518" width="104" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="30" y="518" width="104" height="24" rx="8" fill="#dc2626"/><rect x="30" y="530" width="104" height="12" fill="#dc2626"/>
<text x="82.0" y="535" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">變數·讀取</text>
<text x="82.0" y="566" text-anchor="middle" font-size="13" fill="#0f172a">dist</text>
<rect x="144" y="518" width="104" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="144" y="518" width="104" height="24" rx="8" fill="#dc2626"/><rect x="144" y="530" width="104" height="12" fill="#dc2626"/>
<text x="196.0" y="535" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">比較</text>
<text x="196.0" y="566" text-anchor="middle" font-size="13" fill="#0f172a">a &lt; b</text>
<text x="196.0" y="586" text-anchor="middle" font-size="13" fill="#0f172a">b = 15</text>
<polyline points="82,610 82,626 196,626 196,610" fill="none" stroke="#eab308" stroke-width="3"/>
<rect x="330" y="488" width="340" height="232" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
<text x="342" y="510" font-size="13" font-weight="700" fill="#92400e">切換（邏輯）← 比較結果</text>
<rect x="342" y="522" width="316" height="88.0" rx="8" fill="#ffffff" stroke="#fcd34d"/>
<text x="352" y="542" font-size="15" fill="#16a34a" font-weight="700">✓ 成立</text>
<rect x="430" y="526" width="118" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="430" y="526" width="118" height="24" rx="8" fill="#dc2626"/><rect x="430" y="538" width="118" height="12" fill="#dc2626"/>
<text x="489.0" y="543" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">變數·寫入</text>
<text x="489.0" y="574" text-anchor="middle" font-size="13" fill="#0f172a">speed</text>
<text x="489.0" y="594" text-anchor="middle" font-size="13" fill="#0f172a">← 0</text>
<rect x="342" y="618.0" width="316" height="88.0" rx="8" fill="#ffffff" stroke="#fcd34d"/>
<text x="352" y="638.0" font-size="15" fill="#dc2626" font-weight="700">✗ 不成立</text>
<rect x="430" y="622.0" width="118" height="76" rx="8" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="489.0" y="665.0" text-anchor="middle" font-size="13" fill="#94a3b8">（空，什麼都不做）</text>
<polyline points="248,564 330,564" stroke="#f59e0b" stroke-width="3" fill="none"/>
<text x="760" y="504" font-size="15" font-weight="700" fill="#0369a1">⑤ 驅動：最後的 speed 才送給馬達</text>
<rect x="760" y="518" width="104" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="760" y="518" width="104" height="24" rx="8" fill="#dc2626"/><rect x="760" y="530" width="104" height="12" fill="#dc2626"/>
<text x="812.0" y="535" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">變數·讀取</text>
<text x="812.0" y="566" text-anchor="middle" font-size="13" fill="#0f172a">speed</text>
<rect x="910" y="518" width="130" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="910" y="518" width="130" height="24" rx="8" fill="#16a34a"/><rect x="910" y="530" width="130" height="12" fill="#16a34a"/>
<text x="975.0" y="535" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">移動轉向</text>
<text x="975.0" y="566" text-anchor="middle" font-size="13" fill="#0f172a">B+C</text>
<text x="975.0" y="586" text-anchor="middle" font-size="13" fill="#0f172a">轉向 0</text>
<text x="975.0" y="606" text-anchor="middle" font-size="13" fill="#0f172a">功率 ← speed</text>
<polyline points="812,618 812,634 975,634 975,618" fill="none" stroke="#eab308" stroke-width="3"/>
<text x="760" y="330" font-size="15" font-weight="700" fill="#0369a1">迴圈前（初始化）：speed = 0</text>
<text x="760" y="356" font-size="13" fill="#475569">迴圈尾端加「等待 0.05 秒」；</text>
<text x="760" y="376" font-size="13" fill="#475569">常數 15 / 1.3 / 60 建議各存成變數集中調整</text>
<text x="620.0" y="748" text-anchor="middle" font-size="13" fill="#64748b">黃線＝資料線；橘色框＝切換 (Switch)，條件為「比較」積木的邏輯輸出；①~⑤ 在迴圈內依序執行（基礎版，不含起步遲滯）</text>
</svg>