<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 350" width="100%" font-family="Microsoft JhengHei,Segoe UI,Arial,sans-serif">
<rect width="1260" height="350" fill="#ffffff"/>
<text x="630.0" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">建議最終設計：感測 → 計算 → 驅動（單一公式 clamp(1.5(d−10), 0, 60)）</text>
<rect x="150" y="70" rx="22" width="1090" height="240" fill="none" stroke="#f59e0b" stroke-width="5"/>
<rect x="170" y="58" width="44" height="22" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="192" y="74" text-anchor="middle" font-size="13" fill="#92400e">迴圈 ∞</text>
<rect x="40" y="120" width="104" height="118" rx="30" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
<text x="92.0" y="189.0" text-anchor="middle" font-size="34" fill="#16a34a">▶</text>
<text x="92.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">初始化</text>
<rect x="158" y="120" width="104" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="158" y="120" width="104" height="26" rx="8" fill="#facc15"/><rect x="158" y="134" width="104" height="12" fill="#facc15"/>
<text x="210.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">超音波</text>
<text x="210.0" y="174" text-anchor="middle" font-size="14" fill="#0f172a">測量·公分</text>
<text x="210.0" y="196" text-anchor="middle" font-size="14" fill="#0f172a">Port 4</text>
<text x="210.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">①</text>
<rect x="276" y="120" width="104" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="276" y="120" width="104" height="26" rx="8" fill="#dc2626"/><rect x="276" y="134" width="104" height="12" fill="#dc2626"/>
<text x="328.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">變數·寫入</text>
<text x="328.0" y="174" text-anchor="middle" font-size="14" fill="#0f172a">dist</text>
<text x="328.0" y="196" text-anchor="middle" font-size="14" fill="#0f172a">← 測距值</text>
<text x="328.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">①</text>
<rect x="394" y="120" width="104" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="394" y="120" width="104" height="26" rx="8" fill="#dc2626"/><rect x="394" y="134" width="104" height="12" fill="#dc2626"/>
<text x="446.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Math·進階</text>
<text x="446.0" y="174" text-anchor="middle" font-size="14" fill="#0f172a">x =</text>
<text x="446.0" y="196" text-anchor="middle" font-size="14" fill="#0f172a">1.5*(a-10)</text>
<text x="446.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">②</text>
<rect x="512" y="120" width="104" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="512" y="120" width="104" height="26" rx="8" fill="#dc2626"/><rect x="512" y="134" width="104" height="12" fill="#dc2626"/>
<text x="564.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Math·進階</text>
<text x="564.0" y="174" text-anchor="middle" font-size="14" fill="#0f172a">lo =</text>
<text x="564.0" y="196" text-anchor="middle" font-size="14" fill="#0f172a">(a+abs(a))/2</text>
<text x="564.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">②</text>
<rect x="630" y="120" width="104" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="630" y="120" width="104" height="26" rx="8" fill="#dc2626"/><rect x="630" y="134" width="104" height="12" fill="#dc2626"/>
<text x="682.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Math·進階</text>
<text x="682.0" y="174" text-anchor="middle" font-size="14" fill="#0f172a">speed =</text>
<text x="682.0" y="196" text-anchor="middle" font-size="11" fill="#0f172a" textLength="98" lengthAdjust="spacingAndGlyphs">(a+60-abs(a-60))/2</text>
<text x="682.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">②</text>
<rect x="748" y="120" width="104" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="748" y="120" width="104" height="26" rx="8" fill="#dc2626"/><rect x="748" y="134" width="104" height="12" fill="#dc2626"/>
<text x="800.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">變數·寫入</text>
<text x="800.0" y="174" text-anchor="middle" font-size="14" fill="#0f172a">speed</text>
<text x="800.0" y="196" text-anchor="middle" font-size="14" fill="#0f172a">← 結果</text>
<text x="800.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">②</text>
<rect x="866" y="120" width="104" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="866" y="120" width="104" height="26" rx="8" fill="#dc2626"/><rect x="866" y="134" width="104" height="12" fill="#dc2626"/>
<text x="918.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">變數·讀取</text>
<text x="918.0" y="174" text-anchor="middle" font-size="14" fill="#0f172a">speed</text>
<text x="918.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">③</text>
<rect x="984" y="120" width="104" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="984" y="120" width="104" height="26" rx="8" fill="#16a34a"/><rect x="984" y="134" width="104" height="12" fill="#16a34a"/>
<text x="1036.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">移動轉向</text>
<text x="1036.0" y="174" text-anchor="middle" font-size="14" fill="#0f172a">B+C</text>
<text x="1036.0" y="196" text-anchor="middle" font-size="14" fill="#0f172a">轉向 0</text>
<text x="1036.0" y="218" text-anchor="middle" font-size="14" fill="#0f172a">功率 ← speed</text>
<text x="1036.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">③</text>
<rect x="1102" y="120" width="104" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<rect x="1102" y="120" width="104" height="26" rx="8" fill="#f59e0b"/><rect x="1102" y="134" width="104" height="12" fill="#f59e0b"/>
<text x="1154.0" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">等待</text>
<text x="1154.0" y="174" text-anchor="middle" font-size="14" fill="#0f172a">0.05 秒</text>
<text x="1154.0" y="256" text-anchor="middle" font-size="13" fill="#64748b">③</text>
<polyline points="210.0,238 210.0,266 328.0,266 328.0,238" fill="none" stroke="#eab308" stroke-width="3"/>
<polyline points="446.0,238 446.0,266 564.0,266 564.0,238" fill="none" stroke="#eab308" stroke-width="3"/>
<polyline points="564.0,238 564.0,266 682.0,266 682.0,238" fill="none" stroke="#eab308" stroke-width="3"/>
<polyline points="682.0,238 682.0,266 800.0,266 800.0,238" fill="none" stroke="#eab308" stroke-width="3"/>
<polyline points="918.0,238 918.0,266 1036.0,266 1036.0,238" fill="none" stroke="#eab308" stroke-width="3"/>
<text x="446.0" y="108" text-anchor="middle" font-size="12" fill="#b45309">a ← dist（讀取）</text>
<text x="630.0" y="336" text-anchor="middle" font-size="12" fill="#64748b">黃線＝資料線；Math 進階模式使用 abs() 湊出 max/min 限幅（尚未在 EV3 軟體實測）；執行前先在迴圈外寫入初始 speed = 0</text>
</svg>