<text x="970" y="215" font-size="13" fill="#0f172a">建議：一條直線 + clamp</text>
<text x="920" y="290" font-size="13" font-weight="700" fill="#334155">讀圖重點：</text>
<text x="920" y="314" font-size="13" font-weight="400" fill="#334155">• 橘色（①）在 20、50、70 cm 處有斷崖</text>
<text x="920" y="338" font-size="13" font-weight="400" fill="#334155">• 紫色（②）近距離功率反而最大（越近越快）</text>
<text x="920" y="362" font-size="13" font-weight="400" fill="#334155">• 灰色（④）35 cm 以下為負值（倒車）</text>
<text x="920" y="386" font-size="13" font-weight="400" fill="#334155">• 藍色（建議）連續、單調：越近越慢，</text>
<text x="920" y="410" font-size="13" font-weight="400" fill="#334155">  只有停車線處 0→15% 一次跳變</text>
<text x="630.0" y="506" text-anchor="middle" font-size="12.5" fill="#64748b">②③ 的 ≥50 cm 以「d + 20 有寫回」計；④ 以「+20 沒寫回」計（見筆記第 2~4 章）；虛線連接線表示數值跳變</text>
